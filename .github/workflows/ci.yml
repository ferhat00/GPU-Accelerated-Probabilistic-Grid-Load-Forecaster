name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MOCK_GPU: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set Python 3.11
        run: uv python install 3.11

      - name: Sync dependencies (CPU-only — no `gpu` or `r` extras)
        run: uv sync --extra data --dev

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Typecheck
        run: uv run mypy src

      - name: Test
        run: uv run pytest tests/ -q --cov=src/gpu_grid_forecast --cov-report=term
