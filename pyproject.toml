[project]
name = "gpu-grid-forecast"
version = "0.0.1"
description = "GPU-accelerated probabilistic forecaster of UK national electricity demand."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
authors = [{ name = "Ferhat Culfaz" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
# Phase 1 — data ingestion. Installed in CI; full ERA5 path needs cdsapi locally.
data = [
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.31",
    "pandera>=0.18",
]
# Phase 4b+ — GPU stack. Not installed in CPU CI.
gpu = [
    "torch>=2.2",
    "lightgbm>=4.3",
]
# Phase 4a — R bridge. Installed in WSL2 only.
r = [
    "rpy2>=3.5",
]

[project.scripts]
forecast = "gpu_grid_forecast.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_grid_forecast"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "types-requests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
extend-exclude = ["data", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
# RUF001/002/003 flag intentional en/em dashes in docstrings as "ambiguous unicode" — we use them deliberately.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["typer.*", "lightgbm.*", "rpy2.*", "cudf.*", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "gpu: requires a real CUDA-capable GPU (skipped in CI)",
]

[tool.coverage.run]
source = ["src/gpu_grid_forecast"]
branch = true

[tool.coverage.report]
show_missing = true
